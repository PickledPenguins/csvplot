[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csvplot"
version = "0.26"
description = "Single-file CLI for turning a CSV into a seaborn plot"
readme = "README.md"
requires-python = ">=3.9"
# Classic table form rather than the PEP 639 SPDX string: setuptools only
# understands the latter from 77.0 onward, and install.sh is expected to run
# against whatever setuptools an offline/module-managed environment provides.
license = {text = "GPL-3.0-or-later"}
keywords = ["csv", "plotting", "seaborn", "matplotlib", "cli", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Utilities",
]
dependencies = [
    "pandas>=2.1.1",
    "numpy",
    "matplotlib>=3.7.3",
    "seaborn>=0.13",
    "pyyaml",
]

[project.optional-dependencies]
# Only needed for a robust regression fit (YAML 'robust: true' under a
# regplot). Every other feature works without it, and its absence is reported
# during validation rather than at draw time.
stats = ["statsmodels>=0.12"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "pytest-xdist>=3.0", "pyflakes>=3.0"]

[project.urls]
Homepage = "https://github.com/PickledPenguins/csvplot"
Source = "https://github.com/PickledPenguins/csvplot"
Issues = "https://github.com/PickledPenguins/csvplot/issues"

[project.scripts]
csvplot = "csvplot:_cli_entrypoint"

[tool.setuptools]
py-modules = ["csvplot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: launches csvplot.py as a subprocess (~3.7s each, mostly seaborn import)",
]

[tool.coverage.run]
branch = true
source = ["csvplot"]
# The end-to-end tests invoke csvplot.py as a subprocess. Without parallel mode
# plus the sitecustomize hook described in the README testing section, those
# runs are not measured and the reported figure is misleadingly low.
parallel = true

[tool.coverage.report]
precision = 1
